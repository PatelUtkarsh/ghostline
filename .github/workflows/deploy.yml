name: Deploy to WordPress.org

on:
  release:
    types: [released]
  # A manual run is a dry run: it builds and prepares SVN, but does not commit.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-wporg
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to WordPress.org
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Check the version numbers
        id: version
        run: |
          plugin=$(sed -n 's/^ \* Version: *//p' ghostline.php)
          stable=$(sed -n 's/^Stable tag: *//p' readme.txt)
          echo "Version: $plugin, Stable tag: $stable"
          if [ "$plugin" != "$stable" ]; then
            echo "::error::Version in ghostline.php and Stable tag in readme.txt differ."
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "release" ] && [ "${GITHUB_REF_NAME#v}" != "$plugin" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $plugin."
            exit 1
          fi
          echo "version=$plugin" >> "$GITHUB_OUTPUT"

      - name: Build the plugin zip
        run: |
          npm ci
          npm run build
          npm run plugin-zip
          unzip -q ghostline.zip -d dist

      - name: Prepare the directory assets
        run: rsync -a --exclude demo.gif .wordpress-org/ dist/assets/

      - name: Deploy
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # 2.3.0
        with:
          dry-run: ${{ github.event_name != 'release' }}
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: ghostline
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_DIR: dist/ghostline
          ASSETS_DIR: dist/assets

      - name: Attach the zip to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" ghostline.zip --clobber
